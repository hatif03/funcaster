[profile.default]
src = "contracts"
test = "contracts/test"
out = "../../../.local/commerce-foundry/out"
cache_path = "../../../.local/commerce-foundry/cache"
# Reuse already pinned local dependencies; no additional package lock.
libs = ["../../arc/onchain/lib", "../../arc/onchain/node_modules"]
allow_paths = ["../../arc/onchain"]
solc_version = "0.8.28"
auto_detect_solc = false
evm_version = "cancun"
optimizer = true
optimizer_runs = 200
via_ir = true

[profile.default.fuzz]
runs = 64

[profile.default.invariant]
runs = 16
depth = 16
