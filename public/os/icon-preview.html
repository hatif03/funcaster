<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Game icon review — Funcaster</title>
    <link rel="stylesheet" href="/os/theme/tokens.css" />
    <link rel="stylesheet" href="/os/theme/luna.css" />
    <style>
      body {
        overflow: auto;
        background: #efeee0;
        padding: 32px;
      }
      h1 {
        font-size: 24px;
        font-weight: 400;
      }
      main {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(140px, 1fr));
        gap: 24px;
      }
      figure {
        margin: 0;
        display: grid;
        justify-items: center;
        gap: 12px;
        text-align: center;
      }
      .game-icon {
        width: 96px;
        height: 96px;
      }
    </style>
  </head>
  <body>
    <h1>Funcaster · game icon review</h1>
    <main id="icons"></main>
    <script type="module">
      import { games } from "/core/catalog.js";
      import { gameIcon } from "/os/icon-crop.js";
      for (const game of games) {
        const figure = document.createElement("figure");
        const caption = document.createElement("figcaption");
        caption.textContent = game.title;
        figure.append(gameIcon(game), caption);
        document.getElementById("icons").append(figure);
      }
    </script>
  </body>
</html>
