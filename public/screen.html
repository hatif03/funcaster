<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Watch the party · Funcaster</title>
    <link rel="stylesheet" href="/party/party.css" />
    <link rel="stylesheet" href="/party/arcade.css" />
    <link rel="stylesheet" href="/party/layout.css" />
    <link rel="stylesheet" href="/party/display.css" />
  </head>
  <body class="display-page">
    <header class="display-toolbar">
      <a class="brand" href="/">funcaster.</a>
      ><strong id="display-title">Joining the party…</strong
      ><label
        >Show
        <select id="display-seats">
          <option value="">Everyone</option>
          <option value="0">Player 1</option>
          <option value="1">Player 2</option>
          <option value="2">Player 3</option>
          <option value="3">Player 4</option>
          <option value="0,1">Players 1 + 2</option>
          <option value="2,3">Players 3 + 4</option>
        </select></label
      ><button id="display-fullscreen" class="secondary-button">
        Full screen ↗
      </button>
    </header>
    <section id="screen-pairing" hidden class="display-pairing">
      <img id="screen-qr" alt="Scan to pair your phone with this screen" />
      <div>
        <h1>Your screen. Your phone.</h1>
        <p id="screen-pairing-note">Scan to join this game.</p>
        <div class="display-actions">
          <a
            id="screen-controller"
            class="secondary-button"
            target="_blank"
            rel="noopener"
            >Open this controller ↗</a
          ><button id="screen-ready" class="primary-button">
            Ready on this screen ↗
          </button>
        </div>
        <p id="screen-offer" role="status"></p>
        <div class="display-actions">
          <button id="view-play" class="primary-button" hidden>
            Play on this screen</button
          ><button id="view-decline" class="secondary-button" hidden>
            Not now
          </button>
        </div>
      </div>
    </section>
    <main id="display-stage" class="display-stage">
      <p id="display-note" role="status">
        The host keeps the game running. Your screen follows along.
      </p>
    </main>
    <script src="/socket.io/socket.io.js"></script>
    <script type="module" src="/party/display.js"></script>
  </body>
</html>
